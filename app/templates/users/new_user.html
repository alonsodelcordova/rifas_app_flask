{% extends 'dashboard/layout.html' %}

{% block dashboard_content %}
<div class="bg-white rounded-xl shadow p-6">
    <a class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg m-2"
        href="{{ url_for('users.users') }}"
    >
      <i class="fas fa-arrow-left"></i>
      Volver    
    </a>

  <h2 class="text-xl font-bold my-4">Crear nuevo usuario</h2>

  <form action="{{ url_for('users.new_user') }}" method="POST">
    <div class="my-4">
      <label for="username">Nombre de usuario:</label>
      <input type="text" id="username" name="username" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="role">Rol:</label>
      <select name="role" id="role" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
        {% for r in roles %}
        <option value="{{ r }}">{{ r }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex justify-center">
      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg m-2">
        <i class="fas fa-user-plus"></i>
        Crear
      </button>
    </div>
  </form>
</div>
{% endblock %}
