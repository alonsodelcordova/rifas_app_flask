{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="bg-white rounded-xl shadow p-6">
  <h2 class="text-xl font-bold mb-4">Rifas</h2>

  <table class="w-full text-left">
    <thead>
      <tr class="border-b">
        <th>Título</th>
        <th>Precio</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for rifa in raffles %}
      <tr class="border-b">
        <td>{{ rifa.title }}</td>
        <td>S/ {{ rifa.price_per_number }}</td>
        <td>
          <span class="px-2 py-1 rounded text-sm
            {% if rifa.status == 'active' %}
              bg-green-100 text-green-700
            {% else %}
              bg-gray-200
            {% endif %}
          ">
            {{ rifa.status }}
          </span>

        </td>
        <td>
            <a href="#" class="text-blue-500 hover:underline">
                Ver
            </a>
            {% if rifa.status == 'active' %}
                <a href="{{ url_for('admin.draw_raffle_admin', raffle_id=rifa.id) }}"
                    class="bg-purple-500 text-white px-3 py-1 rounded hover:bg-purple-600">
                    Sortear
                </a>
            {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
