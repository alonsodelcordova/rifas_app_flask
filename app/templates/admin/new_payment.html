{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="bg-white rounded-xl shadow p-6">
  <h2 class="text-xl font-bold mb-4">Nuevo pago</h2>

  <form action="{{ url_for('admin.new_payment') }}" method="POST">
    <div class="my-4">
      <label for="method">Método:</label>
      <select name="method" id="method" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
        <option value="cash">Efectivo</option>
        <option value="card">Tarjeta</option>
      </select>
    </div>

    <div class="my-4">
      <label for="amount">Monto:</label>
      <input type="text" id="amount" name="amount" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="reference_code">Referencia:</label>
      <input type="text" id="reference_code" name="reference_code" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="flex justify-center">
      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg m-2">
        <i class="fas fa-user-plus"></i>
        Crear
      </button>
    </div>
  </form>
</div>
{% endblock %}
