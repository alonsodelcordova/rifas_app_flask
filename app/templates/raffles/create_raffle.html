{% extends "dashboard/layout.html" %}

{% block dashboard_content %}
<div class="bg-white rounded-xl shadow p-6">
    <a class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg m-2"
        href="{{ url_for('raffles.raffles') }}"
    >
      <i class="fas fa-arrow-left"></i>
      Volver    
    </a>

  <h2 class="text-xl font-bold my-4">Crear nueva rifa</h2>

  <form action="{{ url_for('raffles.create') }}" method="POST">
    <div class="my-4">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="price_per_number">Precio por número:</label>
      <input type="text" id="price_per_number" name="price_per_number" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="total_numbers">Números:</label>
      <input type="text" id="total_numbers" name="total_numbers" class="border border-gray-300 rounded-lg px-4 py-2 w-full">
    </div>

    <div class="my-4">
      <label for="description">Descripción:</label>
      <textarea id="description" name="description" class="border border-gray-300 rounded-lg px-4 py-2 w-full"></textarea>
    </div>

    <div class="flex justify-center">
      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg m-2">
        <i class="fas fa-user-plus"></i>
        Crear
      </button>
    </div>
  </form>
</div>
{% endblock %}
